name: Social Affiliate AI Pipeline Scheduler

on:
  schedule:
    # Berjalan secara automatik setiap 2 jam
    - cron: '0 */2 * * *'
  workflow_dispatch: # Pemicu butang "Run workflow" secara manual di GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # MEMAKSA BTH CANCEL JIKA MELEBIHI 5 MINIT (ELAK SEKATAN)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi

      - name: Execute Pipeline Engine
        env:
          # Memaksa Python memaparkan log secara real-time terus ke paparan skrin
          PYTHONUNBUFFERED: "1"

          # Kunci Persekitaran Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Kunci Persekitaran AI OpenRouter
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # Kunci Persekitaran Facebook Page API
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}

          # Kunci Persekitaran Lazada Open Platform API
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_USER_TOKEN: ${{ secrets.LAZADA_USER_TOKEN }}
          LAZADA_LiteApp_Key: ${{ secrets.LAZADA_LITEAPP_KEY }}
          LAZADA_LiteApp_Secret: ${{ secrets.LAZADA_LITEAPP_SECRET }}

          # Kunci Persekitaran Upstash Redis & Vector DB
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}

          # Suis Persekitaran GitHub Actions (Diaktifkan Kedua-duanya)
          ENABLE_TELEGRAM: "true"
          ENABLE_FACEBOOK: "true"
        run: python bin/run_pipeline.py
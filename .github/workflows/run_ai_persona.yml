name: Run AI Persona & Telegram Engine

on:
  workflow_dispatch: # Membolehkan ujian dijalankan secara manual dari tab Actions
  schedule:
    - cron: '0 * * * *' # Dijalankan secara automatik setiap 1 jam

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Script
        env:
          # Membaca dari Repository Variables (vars)
          OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_USERNAME: ${{ vars.TELEGRAM_USERNAME }}
          LAZADA_APP_KEY: ${{ vars.LAZADA_APP_KEY }}
          LAZADA_MEMBER_ID: ${{ vars.LAZADA_MEMBER_ID }}

          # Membaca dari Repository Secrets (secrets)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_USER_TOKEN: ${{ secrets.LAZADA_USER_TOKEN }}
        run: python bin/test_ai_persona.py
name: Run AI Persona & Telegram Engine

on:
  workflow_dispatch: # Membolehkan ujian dijalankan secara manual dari tab Actions
  schedule:
    - cron: '0 * * * *' # Dijalankan secara automatik setiap 1 jam

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Full Pipeline
        env:
          # Configuration & AI Models
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL || vars.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || vars.OPENROUTER_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # Telegram Messaging
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}

          # Lazada Open API & LiteApp Credentials
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY || vars.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_USER_TOKEN: ${{ secrets.LAZADA_USER_TOKEN }}
          LAZADA_MEMBER_ID: ${{ secrets.LAZADA_MEMBER_ID || vars.LAZADA_MEMBER_ID }}
          LAZADA_LiteApp_Key: ${{ secrets.LAZADA_LITEAPP_KEY || secrets.LAZADA_APP_KEY || vars.LAZADA_APP_KEY }}
          LAZADA_LiteApp_Secret: ${{ secrets.LAZADA_LITEAPP_SECRET || secrets.LAZADA_APP_SECRET }}

          # Upstash Redis Deduplication Database
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

        run: python bin/run_pipeline.py
name: Lazada 2-Hour Social Affiliate Engine Pipeline

on:
  schedule:
    # Jalan setiap 2 jam sekali
    - cron: '0 */2 * * *'
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Execute 2-Hour Affiliate Engine Pipeline
        env:
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_USER_TOKEN: ${{ secrets.LAZADA_USER_TOKEN }}
          LAZADA_MEMBER_ID: ${{ secrets.LAZADA_MEMBER_ID }}
          LAZADA_LiteApp_Key: ${{ secrets.LAZADA_LITEAPP_KEY }}
          LAZADA_LiteApp_Secret: ${{ secrets.LAZADA_LITEAPP_SECRET }}

          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}

          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline_v2/run_2hour_pipeline.py
name: Lazada Affiliate Engine (Fetch API Pipeline)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-lazada-engine:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Lazada Direct API Fetch
        env:
          LAZADA_APP_KEY: ${{ secrets.LAZADA_APP_KEY }}
          LAZADA_APP_SECRET: ${{ secrets.LAZADA_APP_SECRET }}
          LAZADA_USER_TOKEN: ${{ secrets.LAZADA_USER_TOKEN }}
          LAZADA_MEMBER_ID: ${{ secrets.LAZADA_MEMBER_ID }}
          LAZADA_LiteApp_Key: ${{ secrets.LAZADA_LITEAPP_KEY }}
          LAZADA_LiteApp_Secret: ${{ secrets.LAZADA_LITEAPP_SECRET }}
        run: |
          python tests_runner/test_lazada_fetch.py
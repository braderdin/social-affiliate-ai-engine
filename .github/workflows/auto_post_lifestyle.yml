name: Auto Post Lifestyle Story (Cikgu Suri Rumah)

on:
  schedule:
    # Berjalan 2 kali sehari:
    # 1. 8:30 AM waktu Malaysia (00:30 UTC) - Cerita Pagi / Sarapan
    # 2. 5:30 PM waktu Malaysia (09:30 UTC) - Cerita Petang / Santai
    - cron: '30 0 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
    # Pilihan larian manual dari tab Actions di GitHub

jobs:
  post-lifestyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Lifestyle Story Posting Engine
        env:
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python bin/run_lifestyle_post_job.py